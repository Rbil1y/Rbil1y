<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="title">
  <title id="title">Billy Rolph Exumé — Full Stack Developer · Web &amp; Mobile</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 50px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 0.5px; }
    .role { font: 600 19px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #FFFFFF; fill-opacity: 0.88; letter-spacing: 3px; }
    .in  { animation: fade 1.1s ease-out both; }
    .in2 { animation: fade 1.1s 0.35s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .in, .in2 { animation: none; } }
  </style>

  <!-- back wave -->
  <path fill="url(#brand)" opacity="0.35" d="M0 0H1200V194C1000 156 800 232 600 196C400 160 200 228 0 190Z">
    <animate attributeName="d" dur="11s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      values="M0 0H1200V194C1000 156 800 232 600 196C400 160 200 228 0 190Z;
              M0 0H1200V188C1000 228 800 150 600 190C400 230 200 160 0 196Z;
              M0 0H1200V194C1000 156 800 232 600 196C400 160 200 228 0 190Z"/>
  </path>

  <!-- front wave -->
  <path fill="url(#brand)" d="M0 0H1200V176C1000 226 800 136 600 176C400 216 200 146 0 186Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      values="M0 0H1200V176C1000 226 800 136 600 176C400 216 200 146 0 186Z;
              M0 0H1200V186C1000 146 800 216 600 180C400 144 200 206 0 174Z;
              M0 0H1200V176C1000 226 800 136 600 176C400 216 200 146 0 186Z"/>
  </path>

  <text class="name in" x="600" y="104" text-anchor="middle">Billy Rolph Exumé</text>
  <text class="role in2" x="600" y="146" text-anchor="middle">FULL STACK DEVELOPER · WEB &amp; MOBILE</text>
</svg>
